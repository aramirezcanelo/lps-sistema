<!doctype html>
<html lang="es">
<head>
  <!-- Metadatos y recursos visuales para la página de error. -->
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ Code }} · {{ Title }} · LPS</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css?v=20261114-3"><link rel="stylesheet" href="/static/css/styles.css?v=20261114-7">
</head>
<body class="error-page">
  <!-- Mensaje de error directo y con una ruta clara para continuar. -->
  <main class="error-card"><span class="error-kicker">Portal Linces por el Servicio</span><div class="error-code">{{ Code }}</div><h1>{{ Title }}</h1><p>{{ Message }}</p><a class="btn btn-primary" href="{{ Back }}">Volver al sistema</a></main>
</body>
</html>
