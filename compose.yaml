services:
  web:
    build: .
    env_file:
      - path: .env
        format: raw
    environment:
      DATABASE_URL: sqlite:////var/data/lps.sqlite3
      MEDIA_ROOT: /var/data/assets
      PORT: "8080"
      COOKIE_SECURE: "false"
      SECURE_SSL_REDIRECT: "false"
    ports:
      - "8080:8080"
    volumes:
      - lps_data:/var/data
    restart: unless-stopped

volumes:
  lps_data:
