services:
  - type: web
    name: lps-sistema
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    disk:
      name: lps-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/lps.sqlite3
      - key: MEDIA_ROOT
        value: /var/data/assets
      - key: SESSION_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "0"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
